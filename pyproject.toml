[project]
name = "rashomon-zoo"
version = "0.1.0.dev0"
description = "Many equally good black boxes per task and their local explanations, stored for analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sebastian R. Müller" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "torch>=2.2",
    "captum>=0.7",
    "openml>=0.14",
]

[project.optional-dependencies]
shap = ["shap>=0.45"]
lime = ["lime>=0.2.0.1"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rashomon_zoo"]
